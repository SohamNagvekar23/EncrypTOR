[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "encryptor"
version = "0.1.0"
description = "Encryption toolkit with a CLI and desktop GUI: an educational pi-digit running-key cipher, ChaCha20-Poly1305, and a known-plaintext crack demo."
readme = "README.md"
authors = [{ name = "Soham Nagvekar" }]
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
encryptor = "encryptor.cli:main"

[project.urls]
Homepage = "https://github.com/SohamNagvekar23/EncrypTOR"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PERF", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
